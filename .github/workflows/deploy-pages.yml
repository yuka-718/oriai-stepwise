name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm
      - id: pages
        uses: actions/configure-pages@v6
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build:pages
        env:
          GITHUB_PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}/
          NEXT_PUBLIC_ORIEDITA_DISCOVERY_URL: https://raw.githubusercontent.com/yuka-718/oriai-stepwise/refs/heads/runtime/oriedita-upstream.json
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
